name: AuraPlayer
options:
  bundleIdPrefix: com.auraplayer
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
targets:
  AuraPlayer:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "**/*.md"
          - "project.yml"
          - ".github"
          - "AuraPlayerTests"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auraplayer.AuraPlayer
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "AuraPlayer needs access to your music files to build your library."
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

  AuraPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraPlayerTests
    dependencies:
      - target: AuraPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auraplayer.AuraPlayerTests
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AuraPlayer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AuraPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
