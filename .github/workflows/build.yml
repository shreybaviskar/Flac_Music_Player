name: Build & Test AuraPlayer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      working-directory: ./AuraPlayer
      run: |
        xcodegen generate
        sed -i '' 's/objectVersion = 77;/objectVersion = 63;/g' AuraPlayer.xcodeproj/project.pbxproj

    - name: Run Unit Tests
      working-directory: ./AuraPlayer
      run: |
        set -o pipefail
        xcodebuild test \
          -project AuraPlayer.xcodeproj \
          -scheme AuraPlayer \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          | xcpretty --color

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: ./AuraPlayer/TestResults.xcresult
        retention-days: 7

  build:
    name: Build Unsigned IPA
    needs: test
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      working-directory: ./AuraPlayer
      run: |
        xcodegen generate
        sed -i '' 's/objectVersion = 77;/objectVersion = 63;/g' AuraPlayer.xcodeproj/project.pbxproj

    - name: Build Unsigned App
      working-directory: ./AuraPlayer
      run: |
        xcodebuild clean build \
          -project AuraPlayer.xcodeproj \
          -scheme AuraPlayer \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA
      working-directory: ./AuraPlayer
      run: |
        rm -rf Payload AuraPlayer.ipa
        mkdir -p Payload
        APP_PATH="$(find build/Build/Products -maxdepth 2 -type d -name 'AuraPlayer.app' | head -n 1)"
        if [ -z "$APP_PATH" ]; then
          echo "AuraPlayer.app not found under build/Build/Products"
          exit 1
        fi
        cp -R "$APP_PATH" Payload/
        zip -qr AuraPlayer.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraPlayer-IPA
        path: ./AuraPlayer/AuraPlayer.ipa
        retention-days: 7
