name: Build AuraPlayer IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      working-directory: ./AuraPlayer
      continue-on-error: true
      run: xcodegen generate > ../xcodegen.log 2>&1

    - name: Build Unsigned App
      working-directory: ./AuraPlayer
      continue-on-error: true
      run: |
        xcodebuild clean build \
          -project AuraPlayer.xcodeproj \
          -scheme AuraPlayer \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" > ../xcodebuild.log 2>&1

    - name: Package IPA
      working-directory: ./AuraPlayer
      continue-on-error: true
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/AuraPlayer.app Payload/
        zip -qr AuraPlayer.ipa Payload

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: BuildLogs
        path: |
          ./xcodegen.log
          ./xcodebuild.log
